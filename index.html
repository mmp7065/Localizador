<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Localizador</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#39ff88;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}
body{
    display:flex;
    align-items:center;
    justify-content:center;
}
.screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}
h1{
    font-size:34px;
    font-weight:700;
    letter-spacing:7px;
    margin:0 0 42px;
    text-shadow:0 0 10px rgba(57,255,136,.35);
}
button{
    background:#000;
    color:#39ff88;
    border:2px solid #39ff88;
    border-radius:8px;
    padding:17px 34px;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:0 0 12px rgba(57,255,136,.18);
    cursor:pointer;
    transition:.15s;
}
button:active{
    transform:scale(.97);
    box-shadow:0 0 20px rgba(57,255,136,.35);
}
button:disabled{
    opacity:.55;
}
.status{
    margin-top:24px;
    max-width:90%;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
}
.error{
    color:#ff5555;
}
.hidden{
    display:none!important;
}
.info{
    font-size:18px;
    line-height:1.9;
    letter-spacing:.4px;
}
.small{
    font-size:12px;
    opacity:.55;
    margin-top:18px;
}
.arrowWrap{
    width:270px;
    height:270px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 0 20px;
}
.arrow{
    width:0;
    height:0;
    border-left:48px solid transparent;
    border-right:48px solid transparent;
    border-bottom:175px solid #39ff88;
    filter:
        drop-shadow(0 0 5px #39ff88)
        drop-shadow(0 0 14px rgba(57,255,136,.45));
    transform-origin:50% 58%;
    animation:tremble .11s infinite alternate ease-in-out;
}
@keyframes tremble{
    0%{margin-left:-2px;margin-top:1px}
    50%{margin-left:2px;margin-top:-1px}
    100%{margin-left:-1px;margin-top:2px}
}
#distance,#direction{
    text-shadow:0 0 7px rgba(57,255,136,.18);
}
</style>
</head>
<body>
<div id="start" class="screen">
<h1>LOCALIZADOR</h1><button id="startBtn">LIGAR LOCALIZADOR</button><div id="status" class="status"></div>
</div>
<div id="target" class="screen hidden">
<h1>PONTO DO PC ATIVO</h1><div class="info">Este celular está representando<br>o ponto onde o PC está.</div>
<div id="targetStatus" class="status">Obtendo GPS...</div><div class="small">Mantenha esta página aberta.</div>
</div>
<div id="locator" class="screen hidden">
<h1>LOCALIZANDO O PC</h1><div class="arrowWrap"><div id="arrow" class="arrow"></div></div>
<div class="info"><div id="distance">Distância: aguardando...</div><div id="direction">Direção: aguardando...</div></div>
<div id="locatorStatus" class="status">Procurando o ponto...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vbfptmapfeoctdoruwzy.supabase.co";
const SUPABASE_KEY="sb_publishable_tsSLFHjAjaa6PG5aENtefQ_NTsXbKLC";
const SESSION_ID="localizador-principal";
const ACTIVE_MS=15000;
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const start=document.getElementById("start"),target=document.getElementById("target"),locator=document.getElementById("locator");
const btn=document.getElementById("startBtn"),status=document.getElementById("status"),targetStatus=document.getElementById("targetStatus");
const locatorStatus=document.getElementById("locatorStatus"),arrow=document.getElementById("arrow");
const distanceEl=document.getElementById("distance"),directionEl=document.getElementById("direction");

let deviceId=localStorage.getItem("localizador_device_id");
if(!deviceId){deviceId=(crypto.randomUUID?crypto.randomUUID():"dev-"+Date.now()+"-"+Math.random().toString(36).slice(2));localStorage.setItem("localizador_device_id",deviceId)}
let myPosition=null,targetPosition=null,lastTargetTime=0,heading=null,heartbeat=null,started=false;

function err(el,msg){el.className="status error";el.textContent=msg}
function fresh(r){
 if(!r||r.ativo!==true)return false;
 const t=Date.parse(r.atualizado_em);
 return Number.isFinite(t)&&Date.now()-t<=ACTIVE_MS&&Number.isFinite(+r.latitude)&&Number.isFinite(+r.longitude);
}
async function getPoint(){
 const {data,error}=await sb.from("localizador").select("*").eq("id",SESSION_ID).maybeSingle();
 if(error)throw new Error("SUPABASE SELECT: "+error.message);
 return data;
}
async function claim(){
 const {data,error}=await sb.from("localizador").insert({
   id:SESSION_ID,latitude:0,longitude:0,atualizado_em:new Date().toISOString(),ativo:false,dispositivo:deviceId
 }).select().maybeSingle();
 if(!error&&data)return true;
 if(error&&(error.code==="23505"||/duplicate|already exists/i.test(error.message)))return false;
 if(error)throw new Error("SUPABASE INSERT: "+error.message);
 return false;
}
async function sendPosition(pos){
 const lat=pos.coords.latitude,lon=pos.coords.longitude;
 const {data,error}=await sb.from("localizador").update({
   latitude:lat,longitude:lon,atualizado_em:new Date().toISOString(),ativo:true
 }).eq("id",SESSION_ID).eq("dispositivo",deviceId).select();
 if(error)throw new Error("SUPABASE UPDATE: "+error.message);
 if(!data||!data.length)throw new Error("O registro não pertence a este celular.");
 targetStatus.className="status";
 targetStatus.textContent="GPS encontrado e enviado. Última atualização: "+new Date().toLocaleTimeString();
}
function startTarget(){
 start.classList.add("hidden");target.classList.remove("hidden");
 if(!navigator.geolocation){err(targetStatus,"Este celular não possui geolocalização.");return}
 navigator.geolocation.watchPosition(async p=>{try{await sendPosition(p)}catch(e){console.error(e);err(targetStatus,"GPS encontrado, mas não foi possível enviar posição.\n"+e.message)}},
 e=>err(targetStatus,"Erro no GPS: "+e.message),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
 heartbeat=setInterval(async()=>{
   try{
    const r=await getPoint();
    if(!r||r.dispositivo!==deviceId){clearInterval(heartbeat);err(targetStatus,"Este celular deixou de ser o ponto.");return}
    const {error}=await sb.from("localizador").update({atualizado_em:new Date().toISOString(),ativo:true}).eq("id",SESSION_ID).eq("dispositivo",deviceId);
    if(error)console.error("HEARTBEAT",error)
   }catch(e){console.error(e)}
 },4000);
}
function setTarget(r){
 if(!fresh(r))return;
 targetPosition={latitude:+r.latitude,longitude:+r.longitude};lastTargetTime=Date.now();
 locatorStatus.className="status";locatorStatus.textContent="PC conectado";updateArrow();
}
function startLocator(r){
 start.classList.add("hidden");locator.classList.remove("hidden");setTarget(r);
 if(!navigator.geolocation){err(locatorStatus,"Este celular não possui GPS.");return}
 navigator.geolocation.watchPosition(p=>{myPosition={latitude:p.coords.latitude,longitude:p.coords.longitude};updateArrow()},
 e=>err(locatorStatus,"Erro no GPS deste celular: "+e.message),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
 const handler=e=>{
   let h=null;if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;
   else if(typeof e.alpha==="number")h=360-e.alpha;
   if(Number.isFinite(h)){heading=h;updateArrow()}
 };
 window.addEventListener("deviceorientationabsolute",handler,true);
 window.addEventListener("deviceorientation",handler,true);
 sb.channel("localizador-"+deviceId).on("postgres_changes",{event:"*",schema:"public",table:"localizador",filter:"id=eq."+SESSION_ID},
 payload=>{if(payload.new&&fresh(payload.new))setTarget(payload.new)}).subscribe();
}
function bearing(a,b,c,d){
 const r=Math.PI/180,p1=a*r,p2=c*r,dl=(d-b)*r,y=Math.sin(dl)*Math.cos(p2);
 const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)/r+360)%360;
}
function dist(a,b,c,d){
 const R=6371000,r=Math.PI/180,la=(c-a)*r,lo=(d-b)*r;
 const x=Math.sin(la/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(lo/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function updateArrow(){
 if(!myPosition||!targetPosition)return;
 if(Date.now()-lastTargetTime>ACTIVE_MS){locatorStatus.textContent="Aguardando atualização do PC...";return}
 const b=bearing(myPosition.latitude,myPosition.longitude,targetPosition.latitude,targetPosition.longitude);
 const d=dist(myPosition.latitude,myPosition.longitude,targetPosition.latitude,targetPosition.longitude);
 const rel=heading==null?b:(b-heading+360)%360;
 arrow.style.transform="rotate("+rel+"deg)";
 distanceEl.textContent="Distância: "+(d<1000?Math.round(d)+" m":(d/1000).toFixed(2)+" km");
 directionEl.textContent="Direção: "+Math.round(b)+"°";
}
async function startSystem(){
 if(started)return;started=true;btn.disabled=true;status.className="status";status.textContent="Verificando ponto existente...";
 try{
   let r=await getPoint();
   if(fresh(r)){startLocator(r);return}
   if(r){
     const {error}=await sb.from("localizador").delete().eq("id",SESSION_ID);
     if(error)throw new Error("SUPABASE DELETE: "+error.message);
   }
   if(!navigator.geolocation)throw new Error("Este celular não possui GPS.");
   status.textContent="Obtendo GPS para registrar este celular como ponto...";
   const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,maximumAge:2000,timeout:15000}));
   const won=await claim();
   if(!won){startLocator(await getPoint());return}
   await sendPosition(p);
   startTarget();
 }catch(e){
   console.error(e);
   if(e&&e.code===1)err(status,"Permissão de localização negada. Permita a localização no navegador.");
   else if(e&&e.code===2)err(status,"Não foi possível encontrar o GPS.");
   else if(e&&e.code===3)err(status,"O GPS demorou demais para responder.");
   else err(status,e.message||String(e));
   btn.disabled=false;started=false;
 }
}
btn.addEventListener("click",startSystem);
</script>
</body>
</html>
