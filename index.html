<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           viewport-fit=cover"
>

<title>Localizador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    background:#000;

    color:#39ff88;

    font-family:Arial,sans-serif;

    overflow:hidden;
}

.screen{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#000;
}

.hidden{
    display:none!important;
}


/* =========================
   TELA INICIAL
========================= */

#start{

    flex-direction:column;

    gap:26px;
}

#title{

    font-size:22px;

    letter-spacing:6px;

    text-shadow:
        0 0 10px #39ff88,
        0 0 25px #39ff8844;
}

button{

    border:1px solid #39ff88;

    background:transparent;

    color:#39ff88;

    padding:18px 28px;

    font-size:15px;

    letter-spacing:2px;

    font-weight:bold;

    box-shadow:
        0 0 18px #39ff8833;

    cursor:pointer;
}

button:active{

    transform:scale(.97);

    background:#39ff8814;
}

#status{

    font-size:10px;

    letter-spacing:3px;

    opacity:.55;

    text-align:center;
}


/* =========================
   LOCALIZADOR
========================= */

#locator{

    flex-direction:column;
}

#arrow{

    width:190px;

    height:190px;

    filter:
        drop-shadow(0 0 12px #39ff88)
        drop-shadow(0 0 30px #39ff8844);

    transform-origin:center;

    will-change:transform;
}

#arrow svg{

    width:100%;
    height:100%;
}

.dot{

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#39ff88;

    box-shadow:
        0 0 10px #39ff88,
        0 0 25px #39ff88;
}

#info{

    position:absolute;

    bottom:28px;

    text-align:center;

    font-size:10px;

    letter-spacing:2px;

    opacity:.55;

    line-height:1.8;
}

#distance{

    font-size:14px;

    letter-spacing:3px;

    opacity:.8;
}

#found{

    position:absolute;

    top:25px;

    font-size:11px;

    letter-spacing:4px;

    opacity:.8;
}

</style>
</head>

<body>


<!-- =========================
     TELA INICIAL
========================= -->

<section id="start" class="screen">

    <div id="title">
        LOCALIZADOR
    </div>

    <button id="startBtn">
        LIGAR LOCALIZADOR
    </button>

    <div id="status">
        AGUARDANDO ATIVAÇÃO
    </div>

</section>


<!-- =========================
     TELA DO LOCALIZADOR
========================= -->

<section id="locator" class="screen hidden">

    <div id="found"></div>

    <div class="dot"></div>

    <div id="arrow">

        <svg viewBox="0 0 100 100">

            <path
                d="M50 5
                   L72 70
                   L50 59
                   L28 70
                   Z"
                fill="none"
                stroke="#39ff88"
                stroke-width="3"
                stroke-linejoin="round"
            />

            <circle
                cx="50"
                cy="50"
                r="3"
                fill="#39ff88"
            />

        </svg>

    </div>

    <div id="distance">
        --
    </div>

    <div id="info">
        LOCALIZADOR ATIVO<br>
        PROCURANDO ALVO
    </div>

</section>


<script>

/* ==================================================
   CONFIGURAÇÃO SUPABASE

   TROQUE ESTES DOIS VALORES
================================================== */

const SUPABASE_URL =
    "https://vbfptmapfeoctdoruwzy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tsSLFHjAjaa6PG5aENtefQ_NTsXbKLC";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   ELEMENTOS
================================================== */

const start =
    document.getElementById("start");

const locator =
    document.getElementById("locator");

const startBtn =
    document.getElementById("startBtn");

const status =
    document.getElementById("status");

const arrow =
    document.getElementById("arrow");

const info =
    document.getElementById("info");

const distanceElement =
    document.getElementById("distance");

const found =
    document.getElementById("found");


/* ==================================================
   IDENTIFICAÇÃO DO DISPOSITIVO
================================================== */

const userAgent =
    navigator.userAgent.toLowerCase();

const isMobile =
    /android|iphone|ipad|ipod|mobile/i.test(userAgent);


/*
   PC = transmissor

   CELULAR = receptor
*/

const deviceType =
    isMobile ? "mobile" : "pc";


/* ==================================================
   IDENTIFICADOR INTERNO
================================================== */

const SESSION_ID =
    "localizador-principal";


/* ==================================================
   VARIÁVEIS
================================================== */

let targetLatitude = null;

let targetLongitude = null;

let currentLatitude = null;

let currentLongitude = null;

let deviceHeading = 0;

let targetBearing = null;


/* ==================================================
   NORMALIZAÇÃO
================================================== */

function norm(angle){

    return (angle + 360) % 360;
}


/* ==================================================
   DIFERENÇA ENTRE ÂNGULOS
================================================== */

function angleDiff(a,b){

    return ((a-b+540)%360)-180;
}


/* ==================================================
   DISTÂNCIA ENTRE DOIS PONTOS
================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const p1 =
        lat1 * Math.PI / 180;

    const p2 =
        lat2 * Math.PI / 180;

    const dp =
        (lat2-lat1) *
        Math.PI / 180;

    const dl =
        (lon2-lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dp/2) *
        Math.sin(dp/2) +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(dl/2) *
        Math.sin(dl/2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}


/* ==================================================
   DIREÇÃO DO CELULAR PARA O PC
================================================== */

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
){

    const p1 =
        lat1 * Math.PI / 180;

    const p2 =
        lat2 * Math.PI / 180;

    const dl =
        (lon2-lon1) *
        Math.PI / 180;

    const y =
        Math.sin(dl) *
        Math.cos(p2);

    const x =
        Math.cos(p1) *
        Math.sin(p2)

        -

        Math.sin(p1) *
        Math.cos(p2) *
        Math.cos(dl);

    const angle =
        Math.atan2(y,x) *
        180 / Math.PI;

    return norm(angle);
}


/* ==================================================
   TREMOR DA SETA
================================================== */

function getTremor(t){

    return (

        Math.sin(t * 7.3) * 1.8 +

        Math.sin(t * 11.7) * 0.9 +

        Math.sin(t * 17.2) * 0.5
    );
}


/* ==================================================
   ANIMAÇÃO DA SETA
================================================== */

function animateArrow(){

    const t =
        Date.now()/1000;

    const tremor =
        getTremor(t);

    if(targetBearing === null){

        const search =

            Math.sin(t*.8)*5 +

            Math.sin(t*1.37)*2;

        arrow.style.transform =
            `rotate(${search+tremor}deg)`;

    }else{

        const direction =
            angleDiff(
                targetBearing,
                deviceHeading
            );

        arrow.style.transform =
            `rotate(${direction+tremor}deg)`;
    }

    requestAnimationFrame(
        animateArrow
    );
}


/* ==================================================
   BÚSSOLA
================================================== */

function orientationHandler(event){

    let heading = null;


    if(
        typeof event.webkitCompassHeading
        === "number"
    ){

        heading =
            event.webkitCompassHeading;
    }

    else if(
        typeof event.alpha
        === "number"
    ){

        heading =
            360-event.alpha;
    }


    if(heading === null)
        return;


    deviceHeading =
        norm(heading);
}


/* ==================================================
   ATIVAR BÚSSOLA
================================================== */

async function activateCompass(){

    try{

        if(

            typeof DeviceOrientationEvent
            !== "undefined"

            &&

            typeof DeviceOrientationEvent
            .requestPermission
            === "function"

        ){

            const permission =
                await DeviceOrientationEvent
                .requestPermission();

            if(
                permission !== "granted"
            ){

                throw new Error(
                    "Compass permission denied"
                );
            }
        }


        window.addEventListener(
            "deviceorientationabsolute",
            orientationHandler,
            true
        );


        window.addEventListener(
            "deviceorientation",
            orientationHandler,
            true
        );

    }

    catch(error){

        console.log(
            "Bússola:",
            error
        );
    }
}


/* ==================================================
   LOCALIZAÇÃO DO PC
================================================== */

function startPC(){

    status.textContent =
        "ATIVANDO LOCALIZAÇÃO...";


    if(!navigator.geolocation){

        status.textContent =
            "GEOLOCALIZAÇÃO NÃO DISPONÍVEL";

        return;
    }


    navigator.geolocation.watchPosition(

        async position => {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            const { error } =
                await supabaseClient
                .from("localizador")
                .upsert({

                    id:SESSION_ID,

                    latitude:
                        currentLatitude,

                    longitude:
                        currentLongitude,

                    atualizado_em:
                        new Date()
                        .toISOString(),

                    ativo:true

                });


            if(error){

                console.error(error);

                status.textContent =
                    "ERRO AO TRANSMITIR";

            }else{

                status.textContent =
                    "LOCALIZADOR ATIVO";
            }

        },

        error => {

            console.error(error);

            status.textContent =
                "NÃO FOI POSSÍVEL OBTER A LOCALIZAÇÃO";
        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:10000
        }
    );
}


/* ==================================================
   RECEBER LOCALIZAÇÃO DO PC
================================================== */

async function startMobile(){

    status.textContent =
        "PROCURANDO PC...";


    await receiveTarget();


    supabaseClient

        .channel("localizador-realtime")

        .on(

            "postgres_changes",

            {

                event:"*",

                schema:"public",

                table:"localizador",

                filter:
                    `id=eq.${SESSION_ID}`

            },

            payload => {

                updateTarget(
                    payload.new
                );

            }

        )

        .subscribe();


    /*
       Também verifica a posição
       atual imediatamente.
    */

    setInterval(
        receiveTarget,
        2000
    );
}


/* ==================================================
   BUSCAR PC
================================================== */

async function receiveTarget(){

    const { data, error } =

        await supabaseClient

        .from("localizador")

        .select("*")

        .eq("id",SESSION_ID)

        .eq("ativo",true)

        .maybeSingle();


    if(error){

        console.error(error);

        return;
    }


    if(data){

        updateTarget(data);

    }else{

        status.textContent =
            "PROCURANDO PC...";
    }
}


/* ==================================================
   ATUALIZAR ALVO
================================================== */

function updateTarget(data){

    if(
        !data ||
        data.latitude === null ||
        data.longitude === null
    )
        return;


    targetLatitude =
        Number(data.latitude);

    targetLongitude =
        Number(data.longitude);


    status.textContent =
        "PC ENCONTRADO";

    found.textContent =
        "ALVO ENCONTRADO";


    if(
        currentLatitude !== null &&
        currentLongitude !== null
    ){

        updateDirection();
    }
}


/* ==================================================
   LOCALIZAÇÃO DO CELULAR
================================================== */

function startMobileLocation(){

    if(!navigator.geolocation)
        return;


    navigator.geolocation.watchPosition(

        position => {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            updateDirection();
        },

        error => {

            console.log(
                "GPS:",
                error
            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:10000
        }
    );
}


/* ==================================================
   CALCULAR DIREÇÃO
================================================== */

function updateDirection(){

    if(
        currentLatitude === null ||
        currentLongitude === null ||

        targetLatitude === null ||
        targetLongitude === null
    )
        return;


    targetBearing =
        calculateBearing(

            currentLatitude,

            currentLongitude,

            targetLatitude,

            targetLongitude
        );


    const distance =
        calculateDistance(

            currentLatitude,

            currentLongitude,

            targetLatitude,

            targetLongitude
        );


    if(distance < 5){

        distanceElement.textContent =
            "ALVO ENCONTRADO";

        info.innerHTML =
            "VOCÊ CHEGOU AO PC";

    }

    else if(distance < 1000){

        distanceElement.textContent =
            Math.round(distance) + " m";

        info.innerHTML =
            "DIREÇÃO DO PC";

    }

    else{

        distanceElement.textContent =
            (distance/1000)
            .toFixed(2)
            + " km";

        info.innerHTML =
            "DIREÇÃO DO PC";
    }
}


/* ==================================================
   BOTÃO
================================================== */

startBtn.addEventListener(
    "click",
    async () => {

        start.classList.add(
            "hidden"
        );

        locator.classList.remove(
            "hidden"
        );


        /*
           CELULAR
        */

        if(deviceType === "mobile"){

            await activateCompass();

            startMobile();

            startMobileLocation();
        }


        /*
           PC
        */

        else{

            startPC();

            info.innerHTML =
                "PC TRANSMITINDO LOCALIZAÇÃO";

            distanceElement.textContent =
                "TRANSMITINDO";
        }

    }
);


/* ==================================================
   COMEÇAR ANIMAÇÃO
================================================== */

animateArrow();

</script>

</body>
</html>
